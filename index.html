<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FuRongX</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #e5e5e5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .phone {
      width: 320px;
      height: 640px;
      background: #000;
      border-radius: 40px;
      padding: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      position: relative;
    }
    .screen {
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
      border-radius: 32px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 50px;
    }
    .notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 28px;
      background: #000;
      border-radius: 0 0 18px 18px;
    }
    .time {
      color: white;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 40px;
    }
    .app-icon {
      width: 70px;
      height: 70px;
      background: white;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      text-decoration: none;
      transition: transform 0.2s;
    }
    .app-icon:active {
      transform: scale(0.92);
    }
    .app-icon img {
      width: 42px;
      height: 42px;
    }
    .logo-top {
      position: absolute;
      top: 45px;
      left: 25px;
      width: 50px;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <div class="notch"></div>
      <img src="2026082314372678.jpg" class="logo-top" alt="Logo">
      <div class="time">12:11</div>
      
      <!-- Gmail 图标 -->
      <a href="mailto:089632147qq@gmail.com" class="app-icon">
        <img src="https://upload.wikimedia.org/wikipedia/commons/7/7e/Gmail_icon_%282020%29.svg" alt="Gmail">
      </a>
    </div>
  </div>
</body>
</html>
