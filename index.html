<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安卓手机界面</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #1a1a2e;
  }

  /* 手机外壳 */
  .phone {
    width: 360px;
    height: 740px;
    background: #000;
    border-radius: 40px;
    padding: 12px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    position: relative;
  }

  /* 屏幕（白色壁纸） */
  .screen {
    width: 100%;
    height: 100%;
    background: #ffffff;
    border-radius: 30px;
    overflow: hidden;
    position: relative;
  }

  /* 左上角实时时间 */
  .clock {
    position: absolute;
    top: 24px;
    left: 28px;
    color: #111;
  }

  .clock .time {
    font-size: 40px;
    font-weight: 300;
    letter-spacing: 1px;
    line-height: 1;
  }

  .clock .date {
    font-size: 13px;
    color: #666;
    margin-top: 6px;
  }
</style>
</head>
<body>

  <div class="phone">
    <div class="screen">
      <div class="clock">
        <div class="time" id="time">--:--</div>
        <div class="date" id="date"></div>
      </div>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();

      const h = String(now.getHours()).padStart(2, "0");
      const m = String(now.getMinutes()).padStart(2, "0");
      document.getElementById("time").textContent = `${h}:${m}`;

      const week = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"][now.getDay()];
      const month = now.getMonth() + 1;
      const day = now.getDate();
      document.getElementById("date").textContent = `${month}月${day}日 ${week}`;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>

</body>
</html>
