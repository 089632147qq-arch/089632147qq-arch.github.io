<html lang="zh-CN">

<meta charset="UTF-8">

<title>FuRongX</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#dfe2e2;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

.phone{
  width:320px;
  height:640px;
  padding:10px;
  border-radius:37px;
  background:#0d0d0d;
  box-shadow:0 28px 65px rgba(0,0,0,.34);
}

.screen{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  border-radius:28px;
  background:linear-gradient(
    145deg,
    #edf1ef 0%,
    #eee9df 48%,
    #d3dfe3 100%
  );
}

.punch-hole{
  position:absolute;
  z-index:20;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  width:18px;
  height:18px;
  border-radius:50%;
  background:#000;
}

.status{
  position:absolute;
  z-index:15;
  top:9px;
  left:0;
  right:0;
  height:28px;
  padding:0 17px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:12px;
  font-weight:650;
}

.hero{
  position:absolute;
  z-index:10;
  top:49px;
  left:21px;
  right:20px;
}

.eyebrow{
  font-size:9px;
  letter-spacing:2px;
  text-transform:uppercase;
  opacity:.48;
  margin-bottom:5px;
}

.name{
  font-size:31px;
  font-weight:850;
  letter-spacing:-1.7px;
}

.subtitle{
  margin-top:6px;
  font-size:10px;
  opacity:.58;
}

.grid{
  position:absolute;
  z-index:10;
  top:145px;
  left:20px;
  right:20px;
  display:grid;
  grid-template-columns:repeat(4,58px);
  justify-content:space-between;
  row-gap:17px;
}

.app{
  width:58px;
  text-decoration:none;
  color:#111;
  display:flex;
  flex-direction:column;
  align-items:center;

  /* 让点击反馈更自然 */
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  transition:transform .14s ease;
}

.app:active{
  transform:scale(.94);
}

.icon{
  width:58px;
  height:58px;
  border-radius:15px;
  background:rgba(255,255,255,.94);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 6px 15px rgba(0,0,0,.17);
  overflow:hidden;

  transition:
    box-shadow .14s ease,
    transform .14s ease;
}

.app:active .icon{
  box-shadow:0 3px 8px rgba(0,0,0,.12);
}

.label{
  font-size:9px;
  font-weight:650;
  margin-top:5px;
}

.app:nth-child(5){
  grid-column:2;
}

.app:nth-child(6){
  grid-column:3;
}

.note{
  position:absolute;
  z-index:10;
  left:20px;
  bottom:40px;
  font-size:9px;
  color:rgba(0,0,0,.48);
}

/* SVG 图标统一 */
.icon svg{
  display:block;
  flex:none;
}
</style>

<script>
function updateTime(){
  const n = new Date();

  document.getElementById("clock").textContent =
    String(n.getHours()).padStart(2,"0") +
    ":" +
    String(n.getMinutes()).padStart(2,"0");
}

updateTime();
setInterval(updateTime, 1000);
</script>
