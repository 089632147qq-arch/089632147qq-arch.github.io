<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安卓手机界面</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #1a1a2e;
  }

  /* 手机外壳 */
  .phone {
    width: 360px;
    height: 740px;
    background: #000;
    border-radius: 40px;
    padding: 12px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    position: relative;
  }

  /* 屏幕 */
  .screen {
    width: 100%;
    height: 100%;
    background: linear-gradient(160deg, #4a6cf7 0%, #6a3ff5 50%, #a24bf0 100%);
    border-radius: 30px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* 状态栏 */
  .status-bar {
    height: 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 20px;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
  }

  .status-right {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .battery {
    width: 22px;
    height: 11px;
    border: 1.5px solid #fff;
    border-radius: 3px;
    position: relative;
    padding: 1.5px;
  }

  .battery::after {
    content: "";
    position: absolute;
    right: -4px;
    top: 3px;
    width: 2px;
    height: 5px;
    background: #fff;
    border-radius: 0 2px 2px 0;
  }

  .battery-level {
    width: 75%;
    height: 100%;
    background: #fff;
    border-radius: 1px;
  }

  /* 主内容区 */
  .content {
    flex: 1;
    padding: 10px 20px;
    display: flex;
    flex-direction: column;
  }

  /* 时间显示 */
  .clock {
    text-align: center;
    color: #fff;
    margin-top: 20px;
    margin-bottom: 40px;
  }

  .clock .time {
    font-size: 64px;
    font-weight: 200;
    letter-spacing: 2px;
    line-height: 1;
  }

  .clock .date {
    font-size: 14px;
    opacity: 0.85;
    margin-top: 8px;
  }

  /* 图标网格 */
  .app-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 22px 0;
    justify-items: center;
  }

  .app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    transition: transform 0.2s;
  }

  .app:active {
    transform: scale(0.9);
  }

  .app-icon {
    width: 52px;
    height: 52px;
    border-radius: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 26px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
  }

  .app-name {
    color: #fff;
    font-size: 11px;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
  }

  /* 不同图标配色 */
  .icon-phone { background: linear-gradient(135deg, #43e97b, #38f9d7); }
  .icon-message { background: linear-gradient(135deg, #4facfe, #00f2fe); }
  .icon-camera { background: linear-gradient(135deg, #fa709a, #fee140); }
  .icon-gallery { background: linear-gradient(135deg, #a18cd1, #fbc2eb); }
  .icon-music { background: linear-gradient(135deg, #f093fb, #f5576c); }
  .icon-video { background: linear-gradient(135deg, #ff9a9e, #fecfef); }
  .icon-map { background: linear-gradient(135deg, #30cfd0, #330867); }
  .icon-settings { background: linear-gradient(135deg, #bdc3c7, #2c3e50); }
  .icon-store { background: linear-gradient(135deg, #ffecd2, #fcb69f); }
  .icon-mail { background: linear-gradient(135deg, #667eea, #764ba2); }
  .icon-calendar { background: linear-gradient(135deg, #ff6a00, #ee0979); }
  .icon-weather { background: linear-gradient(135deg, #2193b0, #6dd5ed); }

  /* 底部导航栏 */
  .dock {
    margin: 0 20px 14px;
    padding: 12px 8px;
    background: rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(12px);
    border-radius: 26px;
    display: flex;
    justify-content: space-around;
    align-items: center;
  }

  .dock .app-icon {
    width: 48px;
    height: 48px;
    font-size: 24px;
  }

  .dock .app-name {
    display: none;
  }

  /* 底部指示条 */
  .home-indicator {
    width: 120px;
    height: 4px;
    background: rgba(255, 255, 255, 0.8);
    border-radius: 2px;
    margin: 0 auto 8px;
  }
</style>
</head>
<body>

  <div class="phone">
    <div class="screen">

      <!-- 状态栏 -->
      <div class="status-bar">
        <span>9:41</span>
        <div class="status-right">
          <span>📶</span>
          <span>📡</span>
          <div class="battery">
            <div class="battery-level"></div>
          </div>
        </div>
      </div>

      <!-- 主内容 -->
      <div class="content">
        <!-- 时钟 -->
        <div class="clock">
          <div class="time">9:41</div>
          <div class="date">10月2日 星期五</div>
        </div>

        <!-- 应用图标 -->
        <div class="app-grid">
          <div class="app">
            <div class="app-icon icon-phone">📞</div>
            <span class="app-name">电话</span>
          </div>
          <div class="app">
            <div class="app-icon icon-message">💬</div>
            <span class="app-name">信息</span>
          </div>
          <div class="app">
            <div class="app-icon icon-camera">📷</div>
            <span class="app-name">相机</span>
          </div>
          <div class="app">
            <div class="app-icon icon-gallery">🖼️</div>
            <span class="app-name">相册</span>
          </div>
          <div class="app">
            <div class="app-icon icon-music">🎵</div>
            <span class="app-name">音乐</span>
          </div>
          <div class="app">
            <div class="app-icon icon-video">🎬</div>
            <span class="app-name">视频</span>
          </div>
          <div class="app">
            <div class="app-icon icon-map">🗺️</div>
            <span class="app-name">地图</span>
          </div>
          <div class="app">
            <div class="app-icon icon-settings">⚙️</div>
            <span class="app-name">设置</span>
          </div>
          <div class="app">
            <div class="app-icon icon-store">🛍️</div>
            <span class="app-name">商店</span>
          </div>
          <div class="app">
            <div class="app-icon icon-mail">✉️</div>
            <span class="app-name">邮件</span>
          </div>
          <div class="app">
            <div class="app-icon icon-calendar">📅</div>
            <span class="app-name">日历</span>
          </div>
          <div class="app">
            <div class="app-icon icon-weather">⛅</div>
            <span class="app-name">天气</span>
          </div>
        </div>
      </div>

      <!-- 底部 Dock 栏 -->
      <div class="dock">
        <div class="app">
          <div class="app-icon icon-phone">📞</div>
        </div>
        <div class="app">
          <div class="app-icon icon-message">💬</div>
        </div>
        <div class="app">
          <div class="app-icon icon-camera">📷</div>
        </div>
        <div class="app">
          <div class="app-icon icon-gallery">🖼️</div>
        </div>
      </div>

      <div class="home-indicator"></div>

    </div>
  </div>

</body>
</html>
