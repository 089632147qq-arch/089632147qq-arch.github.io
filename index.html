<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Phone</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  html, body {
    height: 100%;
    overflow: hidden;      /* 禁止滚动，一屏放下 */
  }

  body {
    display: flex;
    flex-direction: column;
    justify-content: center;   /* 垂直居中 */
    align-items: center;
    background: #1a1a2e;
    gap: 14px;
  }

  /* 屏幕上方的文字 */
  .phone-label {
    color: #ffffff;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 1px;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    flex-shrink: 0;
  }

  /* 手机外壳：用 vh 限制高度，宽度按比例来 */
  .phone {
    height: min(72vh, 621px);   /* 最多占屏幕高度 72% */
    aspect-ratio: 360 / 621;    /* 保持外壳比例 */
    background: #000;
    border-radius: 8vmin;
    padding: 3.2% 3.2%;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    display: flex;
  }

  /* 屏幕（白色壁纸，9:16） */
  .screen {
    width: 100%;
    height: 100%;
    background: #ffffff;
    border-radius: 6vmin;
    overflow: hidden;
    position: relative;
  }

  /* 顶部状态栏 */
  .status-bar {
    height: 12%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 6%;
    position: relative;
  }

  /* 左上角时间 */
  .status-time {
    font-size: 15px;
    font-weight: 500;
    color: #111;
  }

  /* 正中间挖孔摄像头 */
  .camera-hole {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 18px;
    height: 18px;
    background: #000;
    border-radius: 50%;
  }

  /* 右侧留白 */
  .status-right {
    width: 60px;
  }
</style>
</head>
<body>

  <div class="phone-label">FuRong's phone</div>

  <div class="phone">
    <div class="screen">
      <div class="status-bar">
        <span class="status-time" id="clock">14:12</span>
        <div class="camera-hole"></div>
        <div class="status-right"></div>
      </div>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, "0");
      const m = String(now.getMinutes()).padStart(2, "0");
      document.getElementById("clock").textContent = `${h}:${m}`;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>

</body>
</html>
