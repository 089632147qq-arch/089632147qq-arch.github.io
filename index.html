<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安卓手机界面</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #1a1a2e;
  }

  /* 手机外壳 */
  .phone {
    width: 360px;
    height: 740px;
    background: #000;
    border-radius: 40px;
    padding: 12px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    position: relative;
  }

  /* 屏幕（白色壁纸） */
  .screen {
    width: 100%;
    height: 100%;
    background: #ffffff;
    border-radius: 30px;
    overflow: hidden;
    position: relative;
  }

  /* 左上角挖孔摄像头 */
  .camera-hole {
    position: absolute;
    top: 14px;
    left: 20px;
    width: 12px;
    height: 12px;
    background: #000;
    border-radius: 50%;
    box-shadow: inset 0 0 3px rgba(255, 255, 255, 0.25);
    z-index: 10;
  }

  /* 左上角实时时间 */
  .clock {
    position: absolute;
    top: 44px;
    left: 24px;
    color: #3a3a3a;
    font-size: 44px;
    font-weight: 700;
    letter-spacing: 1px;
    line-height: 1;
  }
</style>
</head>
<body>

  <div class="phone">
    <div class="screen">
      <div class="camera-hole"></div>
      <div class="clock" id="clock">--:--:--</div>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();

      const h = String(now.getHours()).padStart(2, "0");
      const m = String(now.getMinutes()).padStart(2, "0");
      const s = String(now.getSeconds()).padStart(2, "0");

      document.getElementById("clock").textContent = `${h}:${m}:${s}`;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>

</body>
</html>
