<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安卓手机界面</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #1a1a2e;
  }

  /* 手机外壳 */
  .phone {
    width: 360px;
    height: 621px;
    background: #000;
    border-radius: 40px;
    padding: 12px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    position: relative;
  }

  /* 屏幕（白色壁纸，9:16） */
  .screen {
    width: 100%;
    height: 100%;
    background: #ffffff;
    border-radius: 30px;
    overflow: hidden;
    position: relative;
  }

  /* 顶部状态栏 */
  .status-bar {
    height: 48px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 22px;
    position: relative;
  }

  /* 左上角时间 */
  .status-time {
    font-size: 15px;
    font-weight: 500;
    color: #111;
  }

  /* 正中间挖孔摄像头 */
  .camera-hole {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 18px;
    height: 18px;
    background: #000;
    border-radius: 50%;
  }

  /* 右侧留白 */
  .status-right {
    width: 60px;
  }
</style>
</head>
<body>

  <div class="phone">
    <div class="screen">
      <div class="status-bar">
        <span class="status-time" id="clock">14:12</span>
        <div class="camera-hole"></div>
        <div class="status-right"></div>
      </div>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, "0");
      const m = String(now.getMinutes()).padStart(2, "0");
      document.getElementById("clock").textContent = `${h}:${m}`;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>

</body>
</html>
