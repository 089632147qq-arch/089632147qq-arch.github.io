<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人自我介绍</title>
    <!-- 引入 Tailwind CSS 方便快速样式设置 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        body {
            font-family: 'Noto Sans SC', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- 导航栏 -->
    <nav class="w-full py-6 px-8 flex justify-between items-center max-w-6xl mx-auto">
        <div class="text-2xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
            MyPortfolio.
        </div>
        <div class="flex space-x-6 text-slate-300">
            <a href="#about" class="hover:text-indigo-400 transition-colors">关于我</a>
            <a href="#skills" class="hover:text-indigo-400 transition-colors">技能兴趣</a>
            <a href="#contact" class="hover:text-indigo-400 transition-colors">联系方式</a>
        </div>
    </nav>

    <!-- 主要内容区 -->
    <main class="max-w-4xl mx-auto px-6 py-12 flex-grow flex flex-col items-center justify-center">
        
        <!-- 头像与基本信息 -->
        <div class="text-center">
            <div class="relative inline-block mb-8">
                <div class="absolute -inset-1 bg-gradient-to-r from-indigo-500 to-cyan-500 rounded-full blur opacity-75 animate-pulse"></div>
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=400" 
                     alt="头像" 
                     class="relative w-36 h-36 rounded-full object-cover border-2 border-slate-700 shadow-2xl">
            </div>
            
            <h1 class="text-4xl sm:text-5xl font-extrabold mb-4 tracking-tight">
                你好，我是 <span class="bg-gradient-to-r from-indigo-400 via-sky-400 to-emerald-400 bg-clip-text text-transparent">你的名字</span> 👋
            </h1>
            
            <p class="text-lg sm:text-xl text-slate-400 max-w-2xl mx-auto mb-8 font-light">
                这里是一句话自我介绍或职业标签（例如：一名热爱生活、关注创新与技术的开发者 / 设计师 / 创作者）。
            </p>

            <!-- 社交网络链接 -->
            <div class="flex justify-center space-x-4 mb-12">
                <a href="#" class="w-12 h-12 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 hover:text-white hover:border-indigo-500 hover:bg-slate-700 transition-all">
                    <i class="fab font-bold fa-github text-xl"></i>
                </a>
                <a href="#" class="w-12 h-12 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 hover:text-white hover:border-indigo-500 hover:bg-slate-700 transition-all">
                    <i class="fab fa-twitter text-xl"></i>
                </a>
                <a href="#" class="w-12 h-12 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 hover:text-white hover:border-indigo-500 hover:bg-slate-700 transition-all">
                    <i class="fas fa-envelope text-xl"></i>
                </a>
            </div>
        </div>

        <!-- 详细介绍 -->
        <section id="about" class="w-full bg-slate-800/50 backdrop-blur border border-slate-700/50 rounded-2xl p-8 mb-8">
            <h2 class="text-2xl font-bold mb-4 text-indigo-400 flex items-center gap-2">
                <i class="fas fa-user-circle"></i> 关于我
            </h2>
            <p class="text-slate-300 leading-relaxed mb-4">
                欢迎来到我的个人主页！这里可以填写你的详细背景介绍，比如你的学习经历、工作方向、个人愿景等。
            </p>
            <p class="text-slate-300 leading-relaxed">
                我喜欢探索新事物、学习新技术，并尝试用创意解决生活中的小问题。
            </p>
        </section>

        <!-- 技能与兴趣 -->
        <section id="skills" class="w-full bg-slate-800/50 backdrop-blur border border-slate-700/50 rounded-2xl p-8">
            <h2 class="text-2xl font-bold mb-6 text-indigo-400 flex items-center gap-2">
                <i class="fas fa-star"></i> 技能与兴趣
            </h2>
            <div class="flex flex-wrap gap-3">
                <span class="px-4 py-2 bg-indigo-500/10 border border-indigo-500/30 text-indigo-300 rounded-full text-sm font-medium">网页设计</span>
                <span class="px-4 py-2 bg-cyan-500/10 border border-cyan-500/30 text-cyan-300 rounded-full text-sm font-medium">编程开发</span>
                <span class="px-4 py-2 bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 rounded-full text-sm font-medium">摄影阅读</span>
                <span class="px-4 py-2 bg-amber-500/10 border border-amber-500/30 text-amber-300 rounded-full text-sm font-medium">人工智能</span>
                <span class="px-4 py-2 bg-rose-500/10 border border-rose-500/30 text-rose-300 rounded-full text-sm font-medium">音乐影视</span>
            </div>
        </section>

    </main>

    <!-- 页脚 -->
    <footer id="contact" class="w-full py-6 border-t border-slate-800 text-center text-slate-500 text-sm">
        © 2026 个人自我介绍主页. Built with Tailwind CSS.
    </footer>

</body>
</html>
